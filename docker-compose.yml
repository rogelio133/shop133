# shop133 — infraestructura local (Fase 0)
#
# Este archivo define SOLO los servicios de infraestructura. Los servicios de
# aplicacion (Catalog.API, Orders.API, ...) se agregan en la Fase 1, cuando
# existan sus Dockerfiles.
#
# IMPORTANTE — las dos formas de alcanzar estos contenedores:
#
#   1. Contenedor -> contenedor: por el NOMBRE DEL SERVICIO dentro de la red
#      shop133-net. Ej: "Server=sqlserver,1433", "amqp://rabbitmq:5672".
#      Eso funciona solo con lo definido en ESTE archivo.
#
#   2. Host -> contenedor: por "localhost" y el puerto publicado. Ej:
#      "Server=localhost,1433". Los puertos al host NO se publican aqui: viven
#      en docker-compose.override.yml, que Compose fusiona automaticamente.
#
# Confundir ambas es el fallo mas comun de esta fase.
#
# Credenciales: se leen del archivo .env de la raiz (no versionado).
# Copia .env.example a .env antes del primer arranque.

services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: shop133-sqlserver
    environment:
      - ACCEPT_EULA=Y
      # MSSQL_SA_PASSWORD, no SA_PASSWORD: esta ultima quedo deprecada en la
      # imagen de SQL Server 2022.
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - MSSQL_PID=Developer
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      # $$ escapa la interpolacion de Compose: la variable la resuelve el shell
      # del contenedor, no el compose file.
      # -C (trust server certificate) es obligatorio con mssql-tools18, que por
      # defecto exige un certificado TLS valido y falla contra el autofirmado.
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      # El primer arranque tarda ~20-30s en aceptar conexiones.
      start_period: 30s
    restart: unless-stopped
    networks:
      - shop133-net

  # Crea las 5 bases (CatalogDb, OrdersDb, InventoryDb, PaymentsDb y, desde 4.6,
  # NotificationsDb) y un login por servicio con permiso SOLO sobre la suya.
  # Arranca, ejecuta el script y
  # sale con 0: no es un servicio de larga vida, por eso no lleva healthcheck
  # ni restart. Con "docker compose ps" no aparece; hace falta "ps -a".
  #
  # El script es idempotente, asi que correrlo en cada "up" no tiene efecto.
  db-init:
    # Reutiliza la imagen de SQL Server en lugar de mcr.../mssql-tools: ya trae
    # /opt/mssql-tools18/bin/sqlcmd y evita descargar (y mantener) una segunda
    # imagen. La de mssql-tools ademas se quedo en la version 17.
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: shop133-db-init
    depends_on:
      sqlserver:
        # Esto es lo que evita el clasico "wait-for-it": no arranca hasta que
        # el healthcheck de sqlserver responde al SELECT 1.
        condition: service_healthy
    environment:
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
      # Las lee sqlcmd como variables de script, $(NOMBRE) dentro del .sql.
      - CATALOG_DB_PASSWORD=${CATALOG_DB_PASSWORD}
      - ORDERS_DB_PASSWORD=${ORDERS_DB_PASSWORD}
      - INVENTORY_DB_PASSWORD=${INVENTORY_DB_PASSWORD}
      - PAYMENTS_DB_PASSWORD=${PAYMENTS_DB_PASSWORD}
      # La quinta, desde 4.6. Sin ella sqlcmd sustituye $(NOTIFICATIONS_DB_PASSWORD)
      # por vacio, el CREATE LOGIN falla contra CHECK_POLICY y db-init sale != 0.
      - NOTIFICATIONS_DB_PASSWORD=${NOTIFICATIONS_DB_PASSWORD}
    volumes:
      - ./db/init:/db-init:ro
    # entrypoint OBLIGATORIO: el de la imagen arranca el motor de SQL Server.
    # Sin sobrescribirlo, este contenedor levantaria un segundo SQL Server en
    # vez de ejecutar el script.
    #
    # Y tiene que ser un shell de verdad ("bash -c"): Compose parte un command
    # en formato string sin shell, asi que "$$MSSQL_SA_PASSWORD" llegaria a
    # sqlcmd como texto literal. La alternativa, dejar que Compose interpole
    # ${MSSQL_SA_PASSWORD}, deja la contrasena en claro en "compose config".
    entrypoint: ["/bin/bash", "-c"]
    # LISTA de un solo elemento, no string: si se escribe como string, Compose
    # lo parte en argv y "bash -c" solo ejecutaria el primer trozo (sqlcmd sin
    # ningun argumento). Todo el comando tiene que llegar como UN argumento.
    #
    # -C: trust del certificado autofirmado (igual que el healthcheck).
    # -b: salir con codigo != 0 si el script falla. Sin el, el contenedor sale
    #     con 0 aunque el SQL reviente y el fallo pasa desapercibido.
    command:
      - >
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD"
        -C -b -i /db-init/01-create-databases.sql
    restart: "no"
    networks:
      - shop133-net

  rabbitmq:
    # La variante -management incluye la UI web del puerto 15672.
    image: rabbitmq:4-management-alpine
    container_name: shop133-rabbitmq
    # El nombre del nodo de RabbitMQ deriva del hostname. Sin fijarlo, cada
    # recreacion del contenedor genera un nodo nuevo que ignora los datos del
    # volumen anterior.
    hostname: shop133-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - shop133-net

  # --- Servicios de aplicacion (Fase 1) ---------------------------------

  # Catalog.API — primer servicio de negocio del proyecto (1.6).
  catalog-api:
    build:
      # El contexto es la RAIZ, no la carpeta del proyecto: Catalog.API.csproj
      # referencia ..\..\..\Shared\Shop133.Contracts y Docker no puede copiar
      # nada por encima del contexto. Ver los comentarios del Dockerfile.
      context: .
      dockerfile: src/Services/Catalog/Catalog.API/Dockerfile
    # Nombre explicito para que la imagen no se llame shop133-catalog-api con
    # el prefijo del proyecto de compose.
    image: shop133/catalog-api:latest
    container_name: shop133-catalog-api
    depends_on:
      db-init:
        # Sobre db-init y NO sobre sqlserver, que es lo que se hace por
        # instinto. En 0.4 se midio: "docker compose up -d" vuelve cuando
        # db-init ARRANCA, no cuando termina, y el script tarda ~5s en crear
        # las 4 bases y sus logins. Con la guarda puesta en sqlserver, este
        # contenedor arrancaria contra una CatalogDb que aun no existe.
        #
        # Esto es tambien lo que justifica el -b de sqlcmd en db-init: sin el,
        # el script saldria con 0 aunque fallara y "completed successfully"
        # seria mentira.
        condition: service_completed_successfully
      # Anadido en 4.8, cuando Catalog.API estreno MassTransit.
      #
      # ES ORDEN, NO CORRECCION, y conviene no confundirlo: 3.1 midio que un
      # broker caido NO impide arrancar a un servicio con MassTransit — loguea
      # "warn: Connection Failed", reintenta con backoff y se reconecta solo
      # cuando el broker vuelve. Asi que sin esta guarda el contenedor arranca
      # igual. Lo que se compra son ~30 s sin ruido de reintentos en un "up -d"
      # en frio; lo que se paga es que "up -d" ahora espera al healthcheck de
      # rabbitmq (start_period 30s).
      #
      # A diferencia de db-init, rabbitmq SI tiene healthcheck, asi que aqui
      # service_healthy esta disponible y es la condicion correcta: con
      # service_started el contenedor arrancaria contra un broker que todavia
      # esta levantando el nodo.
      rabbitmq:
        condition: service_healthy
    environment:
      # Explicito aunque Production ya es el valor por defecto cuando la
      # variable no esta: la decision de 1.5 de quitar la guarda IsDevelopment()
      # de MapOpenApi() depende de esto, y merece verse en el archivo.
      #
      # Efecto secundario que hay que tener presente: en Production los User
      # Secrets NO se cargan. De ahi la variable de abajo.
      - ASPNETCORE_ENVIRONMENT=Production
      # El doble guion bajo es como .NET traduce jerarquia de configuracion en
      # variables de entorno: ConnectionStrings__CatalogDb equivale a la clave
      # "ConnectionStrings:CatalogDb" que lee Program.cs.
      #
      # Server=sqlserver,1433 — el nombre del SERVICIO dentro de shop133-net.
      # "localhost,1433" aqui apuntaria al propio contenedor de la API.
      #
      # La contrasena se deriva de ${CATALOG_DB_PASSWORD}, la MISMA variable que
      # consume db-init para crear el login. Descartado meter un
      # CONNECTIONSTRINGS__CATALOGDB completo en .env: serian dos sitios con la
      # contrasena, y el dia que uno cambie sin el otro el sintoma es un "Login
      # failed for user 'catalog_user'" que no dice donde esta la copia vieja.
      #
      # TrustServerCertificate=True es obligatorio, no opcional:
      # Microsoft.Data.SqlClient cifra por defecto desde la v4.0 y el
      # certificado de SQL Server es autofirmado (mismo motivo que el -C de
      # sqlcmd).
      - "ConnectionStrings__CatalogDb=Server=sqlserver,1433;Database=CatalogDb;User Id=catalog_user;Password=${CATALOG_DB_PASSWORD};TrustServerCertificate=True"
      # OBLIGATORIA desde 4.8, no opcional: la guarda de Program.cs lanza ANTES
      # de app.Build(), y en Production los User Secrets no se cargan. Sin esta
      # linea el contenedor muere al arrancar en el proximo "up -d --build".
      # catalog-api es el unico servicio contenedorizado, asi que es el unico
      # sitio del compose donde esto hace falta.
      #
      # Host "rabbitmq" — el nombre del SERVICIO dentro de shop133-net.
      # "localhost" aqui apuntaria al propio contenedor de la API (el aviso de
      # cabecera de este archivo, otra vez).
      #
      # Se construye en linea desde las MISMAS dos variables que consume el
      # servicio rabbitmq de mas arriba, con el argumento identico que uso 1.6
      # para ${CATALOG_DB_PASSWORD}: dos copias de una credencial divergen, y el
      # sintoma (ACCESS_REFUSED) no senala a la copia vieja. Por eso .env.example
      # no necesita ninguna clave nueva.
      #
      # Sobre el aviso que CLAUDE.md arrastra desde 3.2 ("guest solo autentica
      # desde localhost, problema el dia que los servicios tengan contenedores"):
      # ese dia es hoy, y NO aplica. La imagen oficial de RabbitMQ trae
      # loopback_users.guest = false en /etc/rabbitmq/conf.d/10-defaults.conf, asi
      # que guest autentica sobre shop133-net. El aviso describe una instalacion
      # de RabbitMQ de serie, no esta imagen.
      - "ConnectionStrings__RabbitMq=amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672"
    # Sin healthcheck a proposito: no hay endpoint /health hasta 8.4, y la
    # imagen aspnet de .NET 8+ ya no incluye curl ni wget, asi que cualquier
    # test: HTTP fallaria siempre y dejaria el contenedor en unhealthy.
    restart: unless-stopped
    networks:
      - shop133-net

  # --- Observabilidad ---------------------------------------------------

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: shop133-jaeger
    environment:
      # Sin esto, Jaeger no acepta OTLP directo desde el SDK de OpenTelemetry.
      # Es el receptor que consumira la Fase 7.
      - COLLECTOR_OTLP_ENABLED=true
    # Sin healthcheck a proposito: la imagen all-in-one no trae shell ni wget,
    # asi que cualquier test: fallaria siempre.
    #
    # Sin volumen a proposito: el almacenamiento por defecto es en memoria. Las
    # trazas se pierden al reiniciar el contenedor. Aceptable en desarrollo.
    restart: unless-stopped
    networks:
      - shop133-net

networks:
  shop133-net:
    name: shop133-net
    driver: bridge

volumes:
  sqlserver-data:
  rabbitmq-data:
